# ==============================================================================
# SHVL - Squid HTTP Proxy Configuration
# Listening on Port 3128, 8080 (and multiplexed on Port 80 via HAProxy)
# Target OS: Ubuntu 24.04 & Debian 13
# ==============================================================================

acl localhost src 127.0.0.1/32 ::1
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1

# Allowed Destination Ports for CONNECT Method
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http

# Allowed Tunneling Ports (SSH & OpenVPN)
acl VPN_ports port 22           # OpenSSH
acl VPN_ports port 109          # Dropbear 1
acl VPN_ports port 143          # Dropbear 2
acl VPN_ports port 443          # SSL / TLS / OpenVPN
acl VPN_ports port 1194         # OpenVPN TCP
acl VPN_ports port 80           # HTTP
acl VPN_ports port 8080         # Alt HTTP
acl VPN_ports port 8880         # WS HTTP

acl CONNECT method CONNECT

# Access Control
http_access allow VPN_ports
http_access allow Safe_ports
http_access allow localhost
http_access allow all

# Listening Ports
http_port 3128
http_port 8080

# Anonymity & Stealth Settings
via off
forwarded_for off
reply_header_access Server deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all

# Cache configuration (Disabled for tunneling proxy to maximize speed)
cache deny all
coredump_dir /var/spool/squid
visible_hostname shvl-squid-proxy
