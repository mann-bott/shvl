# ==============================================================================
# SHVL - High Performance Unified Gateway
# Frontend Multiplexer for SSH, VLESS, OpenVPN, and Squid HTTP Proxy
# Target OS: Ubuntu 24.04 & Debian 13 (Systemd, Glibc)
# ==============================================================================

global
    log /dev/log local0 warning
    log /dev/log local1 notice
    maxconn 100000
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30m
    timeout server  30m

# ==============================================================================
# FRONTEND: Plain HTTP (Port 80 & Cloudflare HTTP Ports)
# Handles:
# 1. ACME challenge: /.well-known/acme-challenge/ -> ACME Standalone (:8080)
# 2. VLESS WS / HttpUpgrade / XHTTP               -> Xray Inbounds
# 3. HTTP CONNECT Proxy                           -> Squid Proxy (:3128)
# 4. SSH WebSocket HTTP (Default)                 -> ssh-ws Proxy (:8880)
# ==============================================================================
frontend http_in
    bind *:80,*:8880,*:2082
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_acme        req.payload(0,128) -m sub /.well-known/acme-challenge/
    acl is_vless_ws    req.payload(0,256) -m sub /vless-ws
    acl is_vless_hu    req.payload(0,256) -m sub /vless-hu
    acl is_vless_xhttp req.payload(0,256) -m sub /vless-xhttp
    acl is_http_proxy  req.payload(0,8)   -m sub CONNECT
    tcp-request content accept if { req.len gt 0 }

    use_backend b_acme        if is_acme
    use_backend b_xray_ws     if is_vless_ws
    use_backend b_xray_hu     if is_vless_hu
    use_backend b_xray_xhttp  if is_vless_xhttp
    use_backend b_squid       if is_http_proxy
    default_backend b_ssh_ws

# ==============================================================================
# FRONTEND: Port 443 Multiplexer (Outer Raw TCP Filter)
# Supports:
# 1. Raw OpenVPN TCP (opcode detection: 0x38, 0x50, 0x08) -> OpenVPN (:1194)
# 2. Raw Dropbear SSH (banner "SSH-")                     -> Dropbear (:109)
# 3. TLS Connections (ClientHello type 0x16)              -> TLS Decryptor (:10443)
# ==============================================================================
frontend port_443_in
    bind *:443,*:8443,*:2053,*:2083,*:2087,*:2096
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_raw_ovpn req.payload(2,1) -m bin 38 50 08
    acl is_raw_ssh  req.payload(0,4) -m str SSH-
    acl is_tls      req.ssl_hello_type 1

    use_backend b_openvpn     if is_raw_ovpn
    use_backend b_ssh_direct  if is_raw_ssh
    use_backend b_tls_loop    if is_tls
    default_backend b_tls_loop

backend b_tls_loop
    mode tcp
    server s_tls_loop 127.0.0.1:10443 send-proxy

# ==============================================================================
# FRONTEND: TLS Termination & Inner Decrypted Dispatcher
# Handles:
# 1. SSH SSL/TLS/SNI (Direct decrypted SSH "SSH-") -> Dropbear (:109)
# 2. OpenVPN over SSL (Decrypted OpenVPN payload)  -> OpenVPN (:1194)
# 3. VLESS WS / HttpUpgrade / XHTTP (TLS)          -> Xray Inbounds
# 4. SSH WebSocket TLS (Default WSS)               -> ssh-ws Proxy (:8880)
# ==============================================================================
frontend tls_in
    bind 127.0.0.1:10443 accept-proxy ssl crt /etc/shvl/shvl.pem alpn h2,http/1.1
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_direct_ssh  req.payload(0,4)   -m str SSH-
    acl is_ovpn_ssl    req.payload(2,1)   -m bin 38 50 08
    acl is_acme        req.payload(0,128) -m sub /.well-known/acme-challenge/
    acl is_vless_ws    req.payload(0,256) -m sub /vless-ws
    acl is_vless_hu    req.payload(0,256) -m sub /vless-hu
    acl is_vless_xhttp req.payload(0,256) -m sub /vless-xhttp
    acl is_h2          ssl_fc_alpn -i h2
    tcp-request content accept if { req.len gt 0 } || is_h2

    use_backend b_ssh_direct  if is_direct_ssh
    use_backend b_openvpn     if is_ovpn_ssl
    use_backend b_acme        if is_acme
    use_backend b_xray_ws     if is_vless_ws
    use_backend b_xray_hu     if is_vless_hu
    use_backend b_xray_xhttp  if is_vless_xhttp || is_h2
    default_backend b_ssh_ws

# ==============================================================================
# BACKENDS
# ==============================================================================

# Dropbear Direct SSH
backend b_ssh_direct
    mode tcp
    server s_dropbear 127.0.0.1:109

# OpenVPN TCP Server
backend b_openvpn
    mode tcp
    server s_openvpn 127.0.0.1:1194

# Squid HTTP Proxy
backend b_squid
    mode tcp
    server s_squid 127.0.0.1:3128

# Pure C WebSocket Proxy (Integrated BadVPN UDPGW & API)
backend b_ssh_ws
    mode tcp
    server s_ws 127.0.0.1:10080 send-proxy

# Xray VLESS WebSocket Inbound
backend b_xray_ws
    mode tcp
    server s_xray_ws 127.0.0.1:10001 send-proxy-v2

# Xray VLESS HttpUpgrade Inbound
backend b_xray_hu
    mode tcp
    server s_xray_hu 127.0.0.1:10002 send-proxy-v2

# Xray VLESS XHTTP Inbound
backend b_xray_xhttp
    mode tcp
    server s_xray_xhttp 127.0.0.1:10003 send-proxy-v2

# ACME Standalone Challenge Backend
backend b_acme
    mode tcp
    server s_acme 127.0.0.1:8080
